name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android NDK & SDK paths
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Release via repo script
        run: |
          chmod +x tools/android-dist.sh
          # Force both environment profile flags that Gradle and Cargo scripts look for
          export PROFILE=release
          export BUILD_TYPE=release
          # Directly invoke gradle assembleRelease if the script wraps it, or force flag through
          ./tools/android-dist.sh --release || true
          
          # Explicitly trigger Gradle release assembly to guarantee release flag adherence
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleRelease
            cd ..
          fi

      - name: Clean up Debug and Intermediate Artifacts
        run: |
          # Purge any accidental debug builds from the upload staging path
          find . -name "*debug*" -exec rm -f {} +

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            target/aarch64-linux-android/release/*.apk
            target/armv7-linux-androideabi/release/*.apk
          if-no-files-found: error
