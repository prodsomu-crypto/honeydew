name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android NDK paths
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Release APK
        run: |
          cargo ndk --platform 21 --target arm64-v8a -- build --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-release-apk
          path: target/aarch64-linux-android/release/*.apk
