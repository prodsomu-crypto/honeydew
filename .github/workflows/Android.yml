name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK via SDK Manager cleanly
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-33" || true
          export NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "carat.required=false"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Release APK
        run: |
          cargo ndk --platform 21 --target arm64-linux-android build --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-release-apk
          path: target/android/release/*.apk
