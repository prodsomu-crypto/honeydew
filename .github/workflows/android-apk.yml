name: Android APK

on:
  push:
    branches: ["feature/piano-roll-pattern-cc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - name: Format Rust source
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Format pattern CC editor changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked

      # Use the configured long-lived key when present. Otherwise create a temporary
      # release key so Gradle still builds the actual release variant (not debug).
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/honeydew-release.jks"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No persistent release key configured; generating a temporary signing key. Future updates must use the same signing identity."
            STORE_PASS=$(openssl rand -hex 24)
            # Use one password for both entries: modern keytool defaults to PKCS12,
            # where separate store/key passwords are not supported consistently.
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS=honeydew-release
            keytool -genkeypair -noprompt -storetype JKS -keystore "$RUNNER_TEMP/honeydew-release.jks" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Honeydew Release,O=Honeydew,C=US"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/honeydew-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          tools/android-dist.sh --release
          tools/android-dist.sh --release --base

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/honeydew-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Honeydew-Android-Release-APKs
          path: target/honeydew-android-*-arm*.apk
          if-no-files-found: error
          retention-days: 30
