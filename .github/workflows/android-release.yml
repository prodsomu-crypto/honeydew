name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.13004108'

      - name: Configure Android SDK and NDK
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/28.0.13004108"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust libraries
        run: |
          cargo ndk --platform 26 \
            --target arm64-v8a \
            --target armeabi-v7a \
            --link-libcxx-shared \
            -o android/app/src/main/jniLibs \
            rustc --release --locked --lib -- \
            -C link-arg=-Wl,-z,max-page-size=16384
          mkdir -p target/android/jniLibs
          cp -R android/app/src/main/jniLibs/. target/android/jniLibs/

      - name: Prepare assets
        run: |
          ASSETS_DIR=android/app/src/main/assets
          mkdir -p "$ASSETS_DIR/content"
          if [ ! -f "$ASSETS_DIR/content/index.json" ]; then
            printf '{}\n' > "$ASSETS_DIR/content/index.json"
          fi
          mkdir -p target/android/assets
          cp -R "$ASSETS_DIR/." target/android/assets/

      - name: Generate temporary release keystore
        run: |
          KEYSTORE="$RUNNER_TEMP/honeydew-release.jks"
          STORE_PASSWORD="androidpassword"
          KEY_PASSWORD="androidpassword"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias honeydew-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Honeydew Release,O=Honeydew,C=US"
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble and sign release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="honeydew-release" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify signed release APK
        run: |
          APK=$(find . -name "app-release.apk" | head -n 1)
          test -n "$APK" && test -f "$APK" || { echo "Release APK not found anywhere" >&2; exit 1; }
          echo "Found APK at: $APK"
          cp "$APK" honeydew-arm64-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose honeydew-arm64-release.apk

      - name: Remove release keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-arm64-release
          path: honeydew-arm64-release.apk
          if-no-files-found: error
