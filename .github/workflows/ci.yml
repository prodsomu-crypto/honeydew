name: Android CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        run: cargo fmt
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply rustfmt to Honeydew Sounds changes"
            git push
          fi

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.13004108'

      - name: Configure Android SDK and NDK
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/28.0.13004108"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Android native libraries
        run: |
          cargo ndk --platform 26 \
            --target arm64-v8a \
            --target armeabi-v7a \
            --link-libcxx-shared \
            -o android/app/src/main/jniLibs \
            rustc --release --locked --lib -- \
            -C link-arg=-Wl,-z,max-page-size=16384
          mkdir -p target/android/jniLibs
          cp -R android/app/src/main/jniLibs/. target/android/jniLibs/

      - name: Prepare APK assets
        run: |
          ASSETS_DIR=android/app/src/main/assets
          mkdir -p "$ASSETS_DIR/content"
          if [ ! -f "$ASSETS_DIR/content/index.json" ]; then
            printf '{}\\n' > "$ASSETS_DIR/content/index.json"
          fi
          mkdir -p target/android/assets
          cp -R "$ASSETS_DIR/." target/android/assets/

      - name: Generate temporary signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/honeydew-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass androidpassword \
            -keypass androidpassword \
            -alias honeydew-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Honeydew CI,O=Honeydew,C=US"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=androidpassword" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=honeydew-ci" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=androidpassword" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed Android APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="target/android/outputs/apk/release/app-release.apk"
          test -f "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" honeydew-android-release.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: honeydew-android-release
          path: honeydew-android-release.apk
          if-no-files-found: error
          retention-days: 14
